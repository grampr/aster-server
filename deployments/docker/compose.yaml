services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aster
      POSTGRES_PASSWORD: aster
      POSTGRES_DB: aster
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aster -d aster"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - aster-postgres:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/001-test-db.sql:ro

  storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aster
      MINIO_ROOT_PASSWORD: aster-secret
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - aster-storage:/data

  storage-setup:
    image: minio/mc:latest
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://storage:9000 aster aster-secret &&
      mc mb --ignore-existing local/aster &&
      mc anonymous set none local/aster &&
      mc admin config set local api cors_allow_origin='*' >/dev/null"
    restart: "no"

  voice:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    environment:
      LIVEKIT_KEYS: "devkey: devsecret-devsecret-devsecret-0000"
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

  mail:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  server:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    depends_on:
      database:
        condition: service_healthy
      storage-setup:
        condition: service_completed_successfully
    environment:
      ASTER_HTTP_ADDR: :8080
      ASTER_DATABASE_URL: postgres://aster:aster@database:5432/aster?sslmode=disable
      ASTER_AUTO_MIGRATE: "true"
      ASTER_STORAGE_ENDPOINT: http://storage:9000
      ASTER_STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      ASTER_STORAGE_BUCKET: aster
      ASTER_STORAGE_ACCESS_KEY: aster
      ASTER_STORAGE_SECRET_KEY: aster-secret
      ASTER_SMTP_ADDR: mail:1025
      ASTER_SMTP_FROM: Aster <no-reply@aster.local>
      ASTER_SMTP_TLS: none
      ASTER_VOICE_LIVEKIT_URL: ws://localhost:7880
      ASTER_VOICE_LIVEKIT_API_URL: http://voice:7880
      ASTER_VOICE_LIVEKIT_API_KEY: devkey
      ASTER_VOICE_LIVEKIT_API_SECRET: devsecret-devsecret-devsecret-0000
    ports:
      - "8080:8080"

volumes:
  aster-postgres:
  aster-storage:

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aster
      POSTGRES_PASSWORD: aster
      POSTGRES_DB: aster
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aster -d aster"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - aster-postgres:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/001-test-db.sql:ro

  object-storage:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: aster-local
      MINIO_ROOT_PASSWORD: aster-local-secret
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:5173,http://127.0.0.1:5173,tauri://localhost,http://tauri.localhost"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - aster-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 15

  object-storage-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      object-storage:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://object-storage:9000 aster-local aster-local-secret && mc mb --ignore-existing local/aster-media"]

  server:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      ASTER_HTTP_ADDR: :8080
      ASTER_DATABASE_URL: postgres://aster:aster@database:5432/aster?sslmode=disable
      ASTER_AUTO_MIGRATE: "true"
    ports:
      - "8080:8080"

volumes:
  aster-postgres:
  aster-minio:

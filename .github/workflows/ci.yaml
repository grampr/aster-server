name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aster
          POSTGRES_PASSWORD: aster
          POSTGRES_DB: aster_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aster -d aster_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      ASTER_TEST_DATABASE_URL: postgres://aster:aster@localhost:5432/aster_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
